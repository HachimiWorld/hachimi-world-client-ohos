#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8G
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.incremental.wasm=true
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

# CPF's Compose plugin reads this to pick the OHOS skiko backend. Only `skia` is used by this
# branch; `fusion-renderer` requires the OHOS drawing/image/pixelmap libs instead.
rendererBackend=skia
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
buildkonfig.flavor=release
